name: CI

# Runs on every push/PR to main: typecheck and a real production build.
# Two independent jobs so a typecheck failure doesn't block you from seeing
# whether the build would also have passed.
#
# The previous third job (M10 governance scan for duplicate content /
# cross-links between owned sites) was removed along with Payload CMS — it
# was a `beforeValidate` hook on the Pages collection
# (cms/src/hooks/governanceCheck.ts), and Firestore has no equivalent
# server-side hook on a direct Console edit. There's currently no automated
# backstop for those two platform rules; re-introduce one (e.g. a scheduled
# Cloud Function, or a script run by hand before publishing new pages) if
# they matter again once there's more than one tenant site's worth of content.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # CI-only, not real secrets.
  REVALIDATE_SECRET: ci-only-secret-not-used-for-anything-real

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck all packages
        run: pnpm turbo run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build (apps/web)
        run: pnpm turbo run build --filter=@italy-tours/web
